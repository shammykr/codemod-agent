[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemod-agent"
version = "0.1.0"
description = "AI-powered CLI tool that analyzes codebases, identifies modernization opportunities, and generates validated code changes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shammy Kumar" }]
dependencies = ["click>=8.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
codemod = "codemod_agent.cli:main"

[tool.setuptools.packages.find]
include = ["codemod_agent*"]

[tool.setuptools.package-data]
codemod_agent = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codemod_agent"]
